# Self-contained infra for the direct-transport e2e suite.
#   postgres        - plain Postgres (throwaway; DB user rows are left behind)
#   neon-http-shim  - HTTPS :443 speaking the Neon HTTP query protocol so the UI's
#                     @neondatabase/serverless neon() driver can reach Postgres
#                     WITHOUT any change to ui/src (it forces https://<host>/sql).
#   centrifugo      - reuses the repo's centrifugo/config.json (dev secrets).
#
# Certs for the shim are generated by scripts/gen-certs.sh into ./certs before `up`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ftown
      POSTGRES_PASSWORD: ftown
      POSTGRES_DB: ftown
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftown -d ftown"]
      interval: 2s
      timeout: 3s
      retries: 30

  neon-http-shim:
    build: ./neon-http-shim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHIM_PORT: "443"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ftown
      PGPASSWORD: ftown
      PGDATABASE: ftown
    volumes:
      - ./certs:/certs:ro
    ports:
      # neon() forces port 443 with TLS; publish the shim there on the host.
      - "443:443"

  centrifugo:
    image: centrifugo/centrifugo:v5
    volumes:
      # e2e copy of centrifugo/config.json with allow_publish_for_client:true on every
      # namespace (matching centrifugo/config.prod.json). The repo's dev config.json
      # omits this, which breaks client-side terminal:* / terminal-input:* publishes —
      # see FINDINGS. Same dev HMAC secret + api_key, so nothing else changes.
      - ./centrifugo.config.json:/centrifugo/config.json:ro
    command: centrifugo -c config.json
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
