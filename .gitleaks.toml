# gitleaks config — extends the default ruleset with ftown-specific rules.
title = "ftown gitleaks config"

[extend]
useDefault = true

# Centrifugo config secrets are plain JSON fields the default rules miss.
[[rules]]
id = "centrifugo-config-secret"
description = "Centrifugo secret material in config files"
regex = '''(?i)"(token_hmac_secret_key|api_key|admin_password|admin_secret)"\s*:\s*"([^"]{8,})"'''
secretGroup = 2

[rules.allowlist]
# Placeholder values in the committed example/dev config and docs.
regexes = [
  '''your-centrifugo[a-z-]*''',
  '''^admin$''',
  '''^admin-secret$''',
  '''^<[^>]+>$''',
  # CI render placeholders in centrifugo/config.prod.json — substituted from
  # GitHub secrets at deploy time (see .github/workflows/deploy-centrifugo.yml).
  # Scoped to the exact __CENTRIFUGO_*__ token shape so the rule is not weakened.
  '''^__CENTRIFUGO_[A-Z_]+__$''',
  # Fake, CI-local fixtures used by the e2e suite (see e2e/env.sh) — real-shaped
  # so getRequiredSecret accepts them, but never valid outside a test run.
  '''e2e-centrifugo-(token-secret|api-key)-[0-9a-f]{16}''',
]

[[rules]]
id = "ftown-env-secret"
description = "ftown env-style secret assignment"
regex = '''(?i)(CENTRIFUGO_TOKEN_SECRET|AUTH_SECRET|FTOWN_HOOK_TOKEN|DATABASE_URL)\s*=\s*['"]?([^\s'"]{8,})'''
secretGroup = 2

[rules.allowlist]
regexes = [
  '''(\$\{?[A-Z_]+\}?|<[^>]+>|\.\.\.|xxx+|changeme|example|redacted)''',
  # Code assignments (env.FTOWN_HOOK_TOKEN = options.hookToken), not literals.
  '''^(options|process|env|deps|this|params|String)[.(]''',
  # Documentation placeholders.
  '''^your-''',
  '''://user:password@''',
  # Fake, CI-local fixtures used by the e2e suite (see e2e/env.sh).
  '''e2e-centrifugo-(token-secret|api-key)-[0-9a-f]{16}''',
]

[allowlist]
description = "Global allowlist"
paths = [
  '''node_modules''',
  '''\.gitleaks\.toml$''',
]
regexes = [
  # Fake, CI-local fixtures used by the e2e suite (see e2e/env.sh) — real-shaped
  # so getRequiredSecret accepts them, but never valid outside a test run. Also
  # matches the default generic-api-key rule.
  '''e2e-centrifugo-(token-secret|api-key)-[0-9a-f]{16}''',
]
