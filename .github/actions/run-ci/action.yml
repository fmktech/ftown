name: Run isolated CI validation
description: Run a fixed validation job on the GitHub runner
inputs:
  job:
    required: true
    description: Fixed validation job
  shard:
    required: false
    description: E2E shard as index/total
  npm-version:
    required: false
    description: Release npm matrix version
  base-sha:
    required: false
    description: PR base SHA
  head-sha:
    required: false
    description: PR head SHA
runs:
  using: composite
  steps:
    - name: Run validation on the GitHub runner
      shell: bash
      env:
        INPUT_JOB: ${{ inputs.job }}
        NPM_VERSION: ${{ inputs.npm-version }}
        E2E_SHARD: ${{ inputs.shard }}
        BASE: ${{ inputs.base-sha }}
        HEAD: ${{ inputs.head-sha }}
      run: bash scripts/ci/run-job.sh "$INPUT_JOB"
