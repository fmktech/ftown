name: Bridge version bump

on:
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-version-bump.yml'
      - 'scripts/release/package-changes.mjs'
      - '.github/actions/run-ci/**'
      - 'scripts/ci/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/run-ci
        with:
          job: bridge-version
          boat-api-key: ${{ secrets.BOAT_API_KEY }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
