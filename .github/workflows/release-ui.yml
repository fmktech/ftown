name: Release solo panel bundle

# Publishes the Next.js standalone panel consumed by `ftown-bridge --solo`
# (PANEL_BUNDLE_URL_TEMPLATE in bridge/src/solo/contract.ts). Called as a
# reusable workflow from publish-bridge.yml with the bridge version to
# release — this cuts the release BEFORE the npm package is published, so a
# published bridge never points at a missing panel release. Tag the release
# `ui-v<version>` where <version> is the bridge version (bridge/package.json)
# — the bridge fetches `ftown-ui-standalone-<version>.tar.gz` plus its
# `.sha256` sidecar from this release. Solo builds set NEXT_PUBLIC_SOLO=1:
# root page redirects to /local, SessionProvider is not mounted (contract
# S8), and the build must contain no middleware or /api/auth artifacts (S21,
# asserted below). `workflow_dispatch` allows a manual re-cut of an existing
# version.

on:
  workflow_call:
    inputs:
      version:
        description: 'Bridge version to release the panel bundle for (bridge/package.json)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Bridge version to release the panel bundle for (bridge/package.json)'
        required: true
        type: string

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-ui
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Version parity (input matches bridge/package.json)
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::version input is empty"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version input '$VERSION' is not a valid semver"
            exit 1
          fi
          LOCAL=$(node -p "require('../bridge/package.json').version")
          echo "input version=$VERSION bridge package version=$LOCAL"
          if [ "$VERSION" != "$LOCAL" ]; then
            echo "::error::version input $VERSION does not match bridge/package.json ($LOCAL)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # ui/src/lib/auth.ts calls getRequiredSecret("AUTH_SECRET") at module
      # load, so `next build` needs a value (>=32 chars, must not match
      # /change-me/i) while collecting page data. Build-time only — never
      # read at runtime, and the solo bridge never passes AUTH_SECRET to the
      # panel. Mirrors how e2e.yml sources e2e/env.sh for the same reason.
      - name: Build standalone (solo mode)
        env:
          NEXT_PUBLIC_SOLO: '1'
          AUTH_SECRET: 'build-time-placeholder-solo-panel-not-a-real-secret-0000' # gitleaks:allow
        run: npm run build

      - name: Assemble standalone directory
        run: |
          DIST="$PWD/dist-package"
          mkdir -p "$DIST"
          cp -r .next/standalone/. "$DIST/"
          mkdir -p "$DIST/.next/static"
          cp -r .next/static/. "$DIST/.next/static/"
          if [ -d public ]; then
            mkdir -p "$DIST/public"
            cp -r public/. "$DIST/public/"
          fi
          echo "SOLO_DIST=$DIST" >> "$GITHUB_ENV"

      # S21 note: this repo builds hosted and solo modes from ONE source tree,
      # so hosted artifacts (middleware, /api/auth routes) ARE compiled into
      # every standalone bundle. Their reachability is neutralized at the
      # bridge's solo front, which claims all /api/* for the bridge and proxies
      # only page/static paths to this child — enforced by routing-precedence
      # unit tests in bridge/src/solo/solo-server.test.ts, not by packaging.
      - name: Smoke (root redirects to /local, /local serves)
        run: |
          PORT=4123 HOSTNAME=127.0.0.1 node "$SOLO_DIST/server.js" &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ROOT_CODE=""; LOCAL_CODE=""
          for i in $(seq 1 30); do
            ROOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4123/ || true)
            [ "$ROOT_CODE" = "307" ] && break
            sleep 1
          done
          for i in $(seq 1 30); do
            LOCAL_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4123/local || true)
            [ "$LOCAL_CODE" = "200" ] && break
            sleep 1
          done
          LOCATION=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:4123/)
          echo "root=$ROOT_CODE location=$LOCATION local=$LOCAL_CODE"
          [ "$ROOT_CODE" = "307" ] || { echo "::error::solo root did not redirect"; exit 1; }
          case "$LOCATION" in */local) ;; *) echo "::error::redirect target not /local"; exit 1;; esac
          [ "$LOCAL_CODE" = "200" ] || { echo "::error::/local failed"; exit 1; }

      - name: Package + checksum
        run: |
          : "${VERSION:?VERSION is not set — Version parity step did not export it}"
          tar -czf "ftown-ui-standalone-$VERSION.tar.gz" -C "$SOLO_DIST" .
          sha256sum "ftown-ui-standalone-$VERSION.tar.gz" \
            | awk '{print $1}' > "ftown-ui-standalone-$VERSION.tar.gz.sha256"
          cat "ftown-ui-standalone-$VERSION.tar.gz.sha256"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${VERSION:?VERSION is not set — Version parity step did not export it}"
          if gh release view "ui-v$VERSION" >/dev/null 2>&1; then
            echo "::notice::release ui-v$VERSION already exists, uploading assets to it (--clobber) instead of creating it"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release (create)
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${VERSION:?VERSION is not set — Version parity step did not export it}"
          gh release create "ui-v$VERSION" \
            --title "Solo panel ui-v$VERSION" \
            --notes "Standalone panel bundle for \`ftown-bridge --solo\`. Fetched automatically by bridge >= 0.19.20." \
            "ftown-ui-standalone-$VERSION.tar.gz" \
            "ftown-ui-standalone-$VERSION.tar.gz.sha256"

      - name: Release (upload assets to existing)
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${VERSION:?VERSION is not set — Version parity step did not export it}"
          gh release upload "ui-v$VERSION" \
            "ftown-ui-standalone-$VERSION.tar.gz" \
            "ftown-ui-standalone-$VERSION.tar.gz.sha256" \
            --clobber

      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${VERSION:?VERSION is not set — Version parity step did not export it}"
          ASSETS=$(gh release view "ui-v$VERSION" --json assets -q '.assets[].name')
          echo "$ASSETS"
          for name in "ftown-ui-standalone-$VERSION.tar.gz" "ftown-ui-standalone-$VERSION.tar.gz.sha256"; do
            if ! grep -qxF "$name" <<< "$ASSETS"; then
              echo "::error::expected asset '$name' missing from release ui-v$VERSION"
              exit 1
            fi
          done
