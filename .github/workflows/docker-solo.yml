name: docker-solo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-solo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: docker/solo
          platforms: linux/amd64
          tags: ftown-solo:ci
          load: true
      - name: Boot amd64 image and wait for health
        run: |
          set -euo pipefail
          container_id=$(docker run -d --platform linux/amd64 -p 8040:8040 ftown-solo:ci)
          # The function is called indirectly by the EXIT trap below.
          # shellcheck disable=SC2329
          cleanup() {
            if ! curl --fail --silent http://127.0.0.1:8040/healthz >/dev/null; then
              docker logs "$container_id" || true
            fi
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8040/healthz >/dev/null; then
              echo "Docker Solo is healthy"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              echo "Docker Solo exited before becoming healthy" >&2
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          echo "Docker Solo did not become healthy within 120 seconds" >&2
          docker logs "$container_id"
          exit 1
      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: docker/solo
          platforms: linux/arm64
          tags: ftown-solo:ci-arm64

