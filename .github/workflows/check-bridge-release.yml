name: Check bridge release artifacts

on:
  pull_request:
    paths:
      - 'bridge/**'
      - 'scripts/release/**'
      - '.github/workflows/publish-bridge.yml'
      - '.github/workflows/check-bridge-release.yml'
      - '.github/workflows/bridge-version-bump.yml'
      - '.github/actions/run-ci/**'
      - 'scripts/ci/**'

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        npm: ['11', 'latest']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/run-ci
        with:
          job: release-artifacts
          boat-api-key: ${{ secrets.BOAT_API_KEY }}
          npm-version: ${{ matrix.npm }}
