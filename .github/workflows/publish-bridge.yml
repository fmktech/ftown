name: Publish bridge to npm

on:
  push:
    branches: [main]
    paths: ['bridge/**']
  workflow_dispatch:

# Top-level permissions are the ceiling for every job below. `contents:
# write` is needed by the `publish` job (push the bridge-vX.Y.Z release tag)
# and by the `release-panel` job's `release-ui.yml` call (create the panel
# release). `id-token: write` (npm trusted publishing / OIDC) is scoped down
# to the `publish` job only, since it is the only job that runs `npm
# publish`.
permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-bridge
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_changed: ${{ steps.changes.outputs.package_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Check for package-affecting changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node ../scripts/release/package-changes.mjs --force
          else
            node ../scripts/release/package-changes.mjs "$BASE" "$HEAD"
          fi

      # Fail before the panel release on registry errors, version collisions,
      # or a conflicting release tag. Same-commit partial publishes can retry.
      - name: Preflight both exact npm versions and the release tag
        id: version
        if: steps.changes.outputs.package_changed == 'true'
        run: node ../scripts/release/publish-packages.mjs preflight

  # Cut the panel release BEFORE the npm package is published, so a
  # published bridge never points at a missing panel release.
  release-panel:
    needs: version
    if: needs.version.outputs.package_changed == 'true'
    uses: ./.github/workflows/release-ui.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
    secrets: inherit

  publish:
    needs: [version, release-panel]
    if: needs.version.outputs.package_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify release planning and artifact parity
        run: node --test ../scripts/release/publish-packages.test.mjs ../scripts/release/package-changes.test.mjs

      - name: Publish ftown then ftown-bridge (retry missing packages only)
        run: node ../scripts/release/publish-packages.mjs publish

      - name: Tag release
        run: node ../scripts/release/publish-packages.mjs tag
