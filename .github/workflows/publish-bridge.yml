name: Publish bridge to npm

on:
  push:
    branches: [main]
    paths: ['bridge/**']
  workflow_dispatch:

# Top-level permissions are the ceiling for every job below. `contents:
# write` is needed by the `publish` job (push the bridge-vX.Y.Z release tag)
# and by the `release-panel` job's `release-ui.yml` call (create the panel
# release). `id-token: write` (npm trusted publishing / OIDC) is scoped down
# to the `publish` job only, since it is the only job that runs `npm
# publish`.
permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-bridge
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Two PRs merged close together can both bump to the same version: the
      # first PR's run publishes it, then the second PR's run sees
      # local == published and would otherwise skip publishing silently,
      # losing that PR's changes. On a push (post-merge) that match is
      # therefore treated as an error so the mistake is caught and the
      # branch gets re-bumped and re-merged; workflow_dispatch (manual,
      # possibly re-run intentionally against an already-published version)
      # still skips quietly.
      - name: Check whether the version is unpublished
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view ftown-bridge version 2>/dev/null || echo "none")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::error::bridge/package.json is $LOCAL but that version is already on npm (published from an earlier commit). Bump the version and merge again so this commit ships."
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          fi

  # Cut the panel release BEFORE the npm package is published, so a
  # published bridge never points at a missing panel release.
  release-panel:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/release-ui.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
    secrets: inherit

  publish:
    needs: [version, release-panel]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish

      - name: Tag release
        run: |
          git tag "bridge-v${{ needs.version.outputs.version }}"
          git push origin "bridge-v${{ needs.version.outputs.version }}"
