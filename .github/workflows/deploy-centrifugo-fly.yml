name: Validate Centrifugo for Fly

# Validation only. Production is deployed by Fly's own GitHub integration from main;
# this workflow holds no Fly credentials and never deploys.
on:
  pull_request:
    paths:
      - 'centrifugo/config.fly.json'
      - 'centrifugo/config.prod.json'
      - 'e2e/centrifugo.config.json'
      - '.github/workflows/deploy-centrifugo.yml'
      - 'scripts/deploy/**'
      - 'centrifugo/Dockerfile.fly'
      - 'centrifugo/entrypoint.sh'
      - 'scripts/check-centrifugo-config*'
      - 'centrifugo/.dockerignore'
      - 'centrifugo/fly.toml'
      - '.github/workflows/deploy-centrifugo-fly.yml'
      - '.github/actions/run-ci/**'
      - 'scripts/ci/**'
      - 'docs/centrifugo-fly-rollout.md'
      - 'docs/centrifugo-fly-security-review.md'
  push:
    branches: [main]
    paths:
      - 'centrifugo/config.fly.json'
      - 'centrifugo/config.prod.json'
      - 'e2e/centrifugo.config.json'
      - '.github/workflows/deploy-centrifugo.yml'
      - 'scripts/deploy/**'
      - 'centrifugo/Dockerfile.fly'
      - 'centrifugo/entrypoint.sh'
      - 'scripts/check-centrifugo-config*'
      - 'centrifugo/.dockerignore'
      - 'centrifugo/fly.toml'
      - '.github/workflows/deploy-centrifugo-fly.yml'
      - '.github/actions/run-ci/**'
      - 'scripts/ci/**'

permissions:
  contents: read

env:
  CENTRIFUGO_IMAGE: ftown-centrifugo:ci
  CENTRIFUGO_UPSTREAM: centrifugo/centrifugo:v6.10.2@sha256:34b84f823515927266ce3abfb840fd9e0acabb58805e7e896f5de731217a627d

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/run-ci
        with:
          job: centrifugo
