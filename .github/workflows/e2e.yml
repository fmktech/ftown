name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  direct-transport-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            bridge/package-lock.json
            e2e/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      # The bridge spawns sessions with a hardcoded `/bin/zsh -l`; tmux is the
      # preferred PTY runtime (falls back to direct node-pty if absent).
      - name: Install zsh + tmux
        run: sudo apt-get update && sudo apt-get install -y zsh tmux

      # Runner images ship group/other-writable zsh function/completion dirs, so
      # compinit (run by Ubuntu's /etc/zsh/zshrc for interactive shells) prompts
      # "insecure directories ... [y] or abort" when the bridge spawns
      # `/bin/zsh -l`, and the session never reaches a prompt. Tighten every dir
      # compaudit flags (compaudit is a zsh autoload, so invoke it via zsh), then
      # verify a clean audit. Belt-and-braces with the skip_global_compinit knob
      # written into the bridge's scratch HOME by start-services.sh.
      - name: Fix zsh insecure completion directories
        run: |
          zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null \
            | xargs -r sudo chmod -R g-w,o-w || true
          echo "remaining insecure dirs (want none):"
          zsh -c 'autoload -Uz compaudit; compaudit' || true

      # Postgres + Neon HTTP shim (:443) + Centrifugo (:8000). The shim lets the
      # UI's @neondatabase/serverless neon() driver reach Postgres unmodified.
      - name: Start infra (postgres + neon-http-shim + centrifugo)
        working-directory: e2e
        run: |
          bash scripts/gen-certs.sh
          docker compose up -d --build --wait
          docker compose ps

      - name: Create DB schema
        working-directory: e2e
        run: |
          npm ci
          node scripts/setup-db.mjs

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          set -a; E2E_DIR="$GITHUB_WORKSPACE/e2e" source "$GITHUB_WORKSPACE/e2e/env.sh"; set +a
          npm run build

      - name: Build bridge
        working-directory: bridge
        run: |
          npm ci
          npm run build

      - name: Install Playwright chromium (browsers + OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Start UI + bridge (recorded PIDs, scratch HOME)
        run: bash e2e/scripts/start-services.sh

      - name: Run Playwright e2e
        working-directory: e2e
        run: |
          set -a
          E2E_DIR="$PWD" source env.sh
          export E2E_USER_EMAIL="$(cat .run-email)"
          set +a
          npx playwright test

      - name: Stop UI + bridge (only recorded PIDs)
        if: always()
        run: bash e2e/scripts/stop-services.sh

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/ui.log
            e2e/bridge.log
          retention-days: 7

      # Self-explaining failures: dump compose state, healthcheck history and
      # container logs when any step failed (runs before teardown removes them).
      - name: Dump infra logs on failure
        if: failure()
        working-directory: e2e
        run: |
          docker compose ps -a || true
          echo "===== centrifugo healthcheck history ====="
          docker inspect --format '{{json .State.Health}}' e2e-centrifugo-1 || true
          echo "===== centrifugo logs ====="
          docker compose logs centrifugo || true
          echo "===== neon-http-shim logs ====="
          docker compose logs neon-http-shim || true
          echo "===== postgres logs ====="
          docker compose logs postgres || true

      - name: Tear down infra
        if: always()
        working-directory: e2e
        run: docker compose down -v
