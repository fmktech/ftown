name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-transport-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each shard is a whole isolated stack running one slice of the Playwright suite.
        shard: ['1/3', '2/3', '3/3']
    name: direct-transport-e2e (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/run-ci
        with:
          job: e2e
          shard: ${{ matrix.shard }}

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/ui.log
            e2e/bridge.log
            e2e/ci-infra.log
          retention-days: 7
