<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board v3 — minimal</title>
<style>
:root{
  --bg-base:#0a0a0d;--bg-hover:rgba(255,255,255,.035);
  --text-primary:#e8e8f0;--text-secondary:#aaaac0;--text-muted:#8585a3;--text-faint:#5c5c78;
  --accent:#00ff88;--status-pending:#ffaa00;--status-error:#ff4466;--shell-generic:#00bfff;--pr-merged:#a78bfa;
  --font-mono:"JetBrains Mono","Fira Code","Cascadia Code",ui-monospace,Menlo,monospace;
  --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg-base:#fbfbfc;--bg-hover:rgba(0,0,0,.035);
  --text-primary:#18181f;--text-secondary:#4a4a5c;--text-muted:#6e6e84;--text-faint:#a0a0b2;
  --accent:#00804a;--status-pending:#a35f00;--status-error:#c4102c;--shell-generic:#0070b4;--pr-merged:#6a4bd0;
  color-scheme:light;
}}
:root[data-theme=light]{
  --bg-base:#fbfbfc;--bg-hover:rgba(0,0,0,.035);
  --text-primary:#18181f;--text-secondary:#4a4a5c;--text-muted:#6e6e84;--text-faint:#a0a0b2;
  --accent:#00804a;--status-pending:#a35f00;--status-error:#c4102c;--shell-generic:#0070b4;--pr-merged:#6a4bd0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-base);color:var(--text-primary)}
body{font:13px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:1px solid var(--text-muted);outline-offset:2px;border-radius:3px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 72px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* chrome: plain text controls */
.bar{display:flex;gap:14px;align-items:baseline;font:11px var(--font-mono);color:var(--text-faint);margin-bottom:36px}
.bar .sp{flex:1}
.bar button{color:var(--text-faint);padding:4px 0}
.bar button:hover{color:var(--text-secondary)}
.bar button[aria-pressed=true],.bar button[aria-selected=true]{color:var(--text-primary)}

/* manager line: same shape as the hook activity line */
.mgr{display:flex;gap:10px;align-items:baseline;min-width:0;margin-bottom:36px}
.mgr b{font-weight:600;font-size:15px;flex-shrink:0}
.mgr .st{font:italic 12px var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* groups */
.grp{margin-bottom:28px}
.lbl{display:flex;gap:8px;align-items:baseline;width:100%;font:11px var(--font-mono);color:var(--text-faint);padding:4px 0;min-width:0}
button.lbl:hover{color:var(--text-secondary)}
.lbl .chev{width:14px;flex-shrink:0;text-align:center}
.lbl .nw{white-space:nowrap;flex-shrink:0}
.lbl .peek{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;opacity:.75}
.lbl.loud{color:var(--status-pending)}
.grp[data-open=false] .body{display:none}
.grp.fold .body{padding-top:2px}

/* row: glyph · name · headline */
.row{display:flex;gap:10px;align-items:baseline;width:100%;padding:5px 0;min-width:0;border-radius:3px}
.row:hover{background:var(--bg-hover);box-shadow:-8px 0 0 var(--bg-hover),8px 0 0 var(--bg-hover)}
.g{width:14px;flex-shrink:0;text-align:center;font-family:var(--font-mono);font-size:12px}
.n{font-weight:500;flex-shrink:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h{color:var(--text-muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{font:11px var(--font-mono);color:var(--text-faint);flex-shrink:0;white-space:nowrap}
.r.age{opacity:0}
.row:hover .r.age,.row:focus-visible .r.age,.item[data-open=true] .r.age{opacity:1}
.item[data-open=true] .h{white-space:normal;overflow:visible}
.item[data-open=true] .n{max-width:none}
/* the only loud thing: rows that need someone */
.item.att .n{font-weight:600}
.item.att .h{color:var(--text-primary)}
.r.you{color:var(--status-pending)}
.item.quiet .n{color:var(--text-muted);font-weight:400}
.item.quiet .h{color:var(--text-faint)}
.item.plan .n{color:var(--text-secondary);font-weight:400}
.item.plan .g{color:var(--text-faint);font-size:11px}

/* details: hidden until asked for */
.d{display:none;margin:2px 0 12px 24px;font:11px/1.75 var(--font-mono);color:var(--text-secondary)}
.item[data-open=true] .d{display:block}
.f{display:flex;gap:12px;min-width:0}
.k{width:68px;flex-shrink:0;color:var(--text-faint)}
.v{min-width:0;overflow-wrap:anywhere}
.v i{font-style:italic}
.dim{color:var(--text-faint)}
.opt{color:var(--text-primary);margin-right:14px;white-space:nowrap}
.opt:hover{color:var(--status-pending)}

/* events */
.ev{display:flex;gap:10px;align-items:baseline;width:100%;padding:2px 0;font:11px/1.7 var(--font-mono);color:var(--text-muted);min-width:0}
.ev .t{width:38px;flex-shrink:0;color:var(--text-faint)}
.ev .who{width:132px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
.ev .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev[data-open=true] .s{white-space:normal;overflow-wrap:anywhere}
.ev.faint,.ev.faint .who{color:var(--text-faint)}
.more{font:11px var(--font-mono);color:var(--text-faint);padding:6px 0 0 48px}
.more:hover{color:var(--text-secondary)}
.brief{margin-left:22px;color:var(--text-secondary);max-width:60ch}
.brief p{margin:0 0 8px}
.foot{margin-top:48px;font:11px var(--font-mono);color:var(--text-faint)}
kbd{font:inherit;color:var(--text-muted)}
@media (max-width:520px){
  .wrap{padding:16px 16px 56px}
  .n{max-width:42%}
  .ev .who{width:84px}
  .k{width:58px}
  .foot .keys{display:none}
}
@media (hover:none){.r.age{display:none}.item[data-open=true] .r.age{display:inline;opacity:1}}
</style>
</head>

  if (lastStatus){ const i = lastStatus.summary.indexOf(': '); mgr.state = lastStatus.summary.slice(0,i); mgr.headline = lastStatus.summary.slice(i+2); }
  const rows = (BOARD.cards||[]).map(c => {
    const d = c.declared || {}, v = c.derived || {};
    return {id:c.sessionId, name:c.name, state:d.state||'unset', headline:d.headline||'', updatedAt:d.updatedAt, stale:!!c.stale,
      blockedOn:d.blockedOn, progress:d.progress, next:d.next, activity:v.activity, toolName:v.toolName, idleSince:v.idleSince,
      status:v.status, openAttention:v.openAttention||0, unreadMail:v.unreadMail||0, previews:v.previews||[],
      shellType:v.shellType, model:v.model, worktree:v.worktree, pr:v.pr};
  });
  return {now, mgr, rows, planned:[], events:evs, brief:null, rootId:BOARD.rootId, snap:'snapshot '+hhmm(new Date(now).toISOString())+' UTC · real board + events'};
}

/* ---------- derivations ---------- */
// The only loud rows: failed, blocked, or a question escalated to the human.
function attention(r){
  if (r.question && r.question.route === 'human') return 'you';
  if (r.state === 'failed') return r.owner || 'you';
  if (r.state === 'blocked') return r.owner || (r.blockedOn && r.blockedOn.kind === 'human' ? 'you' : 'manager');
  return null;
}
const ATT_ORDER = {failed:0, blocked:1};
const youFirst = r => attention(r) === 'you' ? 0 : 1;
const ACT_ORDER = {waiting_review:0, working:1, unset:2};
const byNewest = (a,b) => (Date.parse(b.updatedAt||0)||0) - (Date.parse(a.updatedAt||0)||0);

function facts(r, m){
  const out = [];
  const add = (k,v) => out.push(`<div class="f"><span class="k">${k}</span><span class="v">${v}</span></div>`);
  let st = col(COLOR[r.state], esc(LABEL[r.state]));
  if (r.progress && r.progress.total > 0 && r.state !== 'done') st += ` ${r.progress.done}/${r.progress.total}`;
  if (r.updatedAt) st += ` <span class="dim">· updated ${age(m.now - Date.parse(r.updatedAt))} ago</span>`;
  if (r.stale) st += ` ${col('var(--status-pending)','· stale')}`;
  add('state', st);
  if (r.blockedOn) add('blocked', `on ${esc(r.blockedOn.kind)}: ${esc(r.blockedOn.text)}`);
  if (r.question){
    const q = r.question, mine = q.route === 'human';
    add('question', `${esc(q.title)} <span class="dim">· ${mine ? 'for you' : 'with ' + esc(m.mgr.name)}</span>`);
    if (q.note) add('', `<span class="dim">${esc(q.note)}</span>`);
    if (q.options) add('', q.options.map((o,i) => `<button class="opt" type="button">${String.fromCharCode(97+i)}) ${esc(o)}</button>`).join(''));
  } else if (r.openAttention) add('question', `${r.openAttention} open`);
  if (r.next) add('next', esc(r.next));
  let act = '';
  if (r.status === 'exited') act = '<span class="dim">■ session exited</span>';
  else if (r.activity === 'tool_use') act = `<i>⚙ using ${esc(r.toolName || 'a tool')}</i>`;
  else if (r.activity === 'thinking') act = '<i>◌ thinking…</i>';
  else if (r.activity === 'idle') act = `<span class="dim">◦ idle${r.idleSince ? ' ' + age(m.now - Date.parse(r.idleSince)) : ''}${r.state === 'done' ? ' · session still open' : ''}</span>`;
  if (act) add('activity', act);
  if (r.pr){
    const c = {passed:['✓','var(--accent)','checks passed'],running:['◌','var(--status-pending)','checks running'],
      failed:['✗','var(--status-error)','checks failed'],merged:['⬥','var(--pr-merged)','merged']}[r.pr.checks];
    add('pr', `#${r.pr.num}${c ? ' ' + col(c[1], c[0] + ' ' + c[2]) : ''}`);
  }
  if (r.worktree){
    const w = r.worktree, bits = [esc(w.branch)];
    if (w.dirty) bits.push('dirty'); if (w.ahead) bits.push('↑' + w.ahead);
    if (w.retained) bits.push('retained: ' + esc(w.retained));
    add('worktree', '⎇ ' + bits.join(' <span class="dim">·</span> '));
  }
  if (r.unreadMail) add('mail', `${r.unreadMail} unread`);
  if (r.previews && r.previews.length) add('preview', r.previews.map(p => esc(p.name || p)).join(', '));
  if (r.shellType) add('agent', `<span class="dim">${esc(r.shellType)}${r.model ? ' · ' + esc(r.model) : ''}</span>`);
  const mine = m.events.filter(e => e.sessionId === r.id || (e.sessionId === e.sessionName && e.sessionName === r.name)).slice(-3).reverse();
  mine.forEach((e,i) => add(i ? '' : 'events', `<span class="dim">${hhmm(e.ts)}</span> ${esc(firstSeg(e.summary))}`));
  return out.join('');
}
const firstSeg = s => { const i = s.indexOf(' | '); return i < 0 ? s : s.slice(0,i) + ' …'; };

function rowHtml(r, m, kind){
  const who = attention(r);
  const q = who === 'you' && r.question;
  const key = q ? 'question' : r.state;
  const gcol = r.stale && r.state === 'working' ? 'var(--text-muted)' : COLOR[key];
  const cls = kind === 'att' ? 'att' : (r.state === 'done' || r.state === 'unset') ? 'quiet' : '';
  const right = kind === 'att'
    ? `<span class="r ${who === 'you' ? 'you' : ''}">${who === 'you' ? 'you' : esc(who === 'manager' ? m.mgr.name : who)}</span>`
    : (r.updatedAt ? `<span class="r age">${age(m.now - Date.parse(r.updatedAt))}</span>` : '');
  const headline = r.headline || (r.state === 'unset' ? 'no status declared' : '');
  const op = isOpen(r.id);
  return `<div class="item ${cls}" data-key="${esc(r.id)}" data-open="${op}">
    <button class="row" type="button" aria-expanded="${op}" aria-label="${esc(LABEL[r.state])}: ${esc(r.name)} — ${esc(headline)}">
      <span class="g" style="color:${gcol}" aria-hidden="true">${GLYPH[key]}</span><span class="n">${esc(r.name)}</span><span class="h">${esc(headline)}</span>${right}
    </button>
    <div class="d">${facts(r, m)}</div>
  </div>`;
}

function fold(id, label, count, peek, body, open){
  return `<section class="grp fold" data-id="${id}" data-open="${open}">
    <button class="lbl" type="button" aria-expanded="${open}"><span class="chev" aria-hidden="true">${open ? '▾' : '▸'}</span><span class="nw">${label}${count !== '' ? ' · ' + count : ''}</span><span class="peek">${peek}</span></button>
    <div class="body">${body}</div></section>`;
}

function eventsHtml(m){
  const KG = {idle:'◦',result:'◆',pr:'⬥',note:'✎',attention:'?',mail:'✉',preview:'▣',exit:'■'};
  const list = [];
  for (const e of m.events){ const p = list[list.length-1];
    if (p && p.sessionName === e.sessionName && p.kind === e.kind && p.summary === e.summary) { p.n++; p.ts = e.ts; } else list.push({...e, n:1}); }
  list.reverse();
  let lastT = '';
  const line = e => {
    let g = KG[e.kind] || '·', c = 'inherit', s = e.summary;
    if (e.kind === 'status'){ const i = s.indexOf(': '); const stt = s.slice(0,i); if (GLYPH[stt]){ g = GLYPH[stt]; c = COLOR[stt]; s = s.slice(i+2); } }
    const t = hhmm(e.ts), showT = t !== lastT; lastT = t;
    return `<button type="button" class="ev ${e.kind === 'idle' ? 'faint' : ''}" data-open="false"><span class="t">${showT ? t : ''}</span><span class="who">${esc(e.sessionName)}</span><span class="s"><span style="color:${c}">${g}</span> ${esc(s)}${e.n > 1 ? ' <span class="dim">×' + e.n + '</span>' : ''}</span></button>`;
  };
  const head = list.slice(0,12).map(line).join('');
  const rest = list.slice(12);
  const tail = rest.length ? `<div class="rest" hidden>${rest.map(line).join('')}</div><button type="button" class="more">show ${rest.length} older</button>` : '';
  const last = list[0];
  const peek = last ? `last ${hhmm(last.ts)} ${esc(last.sessionName)} ${esc(firstSeg(last.summary))}` : '';
  return fold('events', 'events', m.events.length, peek, head + tail, OPEN.events);
}

/* ---------- render ---------- */
let TAB = 'live', ALL = false;
const OPENROWS = new Set();
const isOpen = k => ALL || OPENROWS.has(k);
const OPEN = {planned:false, done:false, events:false, brief:false};
const MODELS = {live: liveModel(), sample: sampleModel()};

function render(){
  const m = MODELS[TAB];
  const att = m.rows.filter(r => attention(r)).sort((a,b) => youFirst(a) - youFirst(b) || (ATT_ORDER[a.state] ?? -1) - (ATT_ORDER[b.state] ?? -1) || byNewest(a,b));
  const rest = m.rows.filter(r => !attention(r));
  const active = rest.filter(r => r.state !== 'done').sort((a,b) => ACT_ORDER[a.state] - ACT_ORDER[b.state] || byNewest(a,b));
  const done = rest.filter(r => r.state === 'done').sort(byNewest);
  let h = `<div class="mgr"><b>${esc(m.mgr.name)}</b><span class="st" style="color:${COLOR[m.mgr.state] || 'var(--text-muted)'}">${GLYPH[m.mgr.state] || '○'} ${esc(LABEL[m.mgr.state] || m.mgr.state)}${m.mgr.headline ? ' · ' + esc(m.mgr.headline) : ''}</span></div>`;
  if (att.length) h += `<section class="grp"><div class="lbl loud"><span class="chev" aria-hidden="true"></span><span>needs attention · ${att.length}</span></div>${att.map(r => rowHtml(r, m, 'att')).join('')}</section>`;
  if (active.length) h += `<section class="grp"><div class="lbl"><span class="chev" aria-hidden="true"></span><span>active · ${active.length}</span></div>${active.map(r => rowHtml(r, m)).join('')}</section>`;
  else if (!att.length) h += `<section class="grp"><div class="lbl"><span class="chev"></span><span>nothing running</span></div></section>`;
  // future todo list: planned, not yet started, in precedence order
  const pBody = m.planned.map((p,i) => `<div class="item plan" data-key="plan:${esc(p.name)}" data-open="${isOpen('plan:'+p.name)}"><button class="row" type="button" aria-expanded="${isOpen('plan:'+p.name)}"><span class="g" aria-hidden="true">${i+1}</span><span class="n">${esc(p.name)}</span><span class="h">${esc(p.headline)}</span></button>
      <div class="d"><div class="f"><span class="k">after</span><span class="v">${p.after.length ? p.after.map(esc).join(', ') : '<span class="dim">nothing — ready to start</span>'}</span></div></div></div>`).join('')
    || `<div class="more" style="padding-left:24px;cursor:default">nothing planned · todo items are not in the contract yet</div>`;
  h += fold('planned', 'planned', m.planned.length || '', m.planned.length ? 'next: ' + esc(m.planned[0].name) : 'none', pBody, OPEN.planned);
  if (done.length) h += fold('done', 'done', done.length, done.map(r => esc(r.name)).join(', '), done.map(r => rowHtml(r, m)).join(''), OPEN.done);
  h += eventsHtml(m);
  if (m.brief) h += fold('brief', 'brief', '', 'updated ' + age(m.now - Date.parse(m.brief.updatedAt)) + ' ago', `<div class="brief">${m.brief.text.map(t => `<p>${esc(t)}</p>`).join('')}</div>`, OPEN.brief);
  document.getElementById('app').innerHTML = h;
  document.getElementById('snap').textContent = m.snap;
}

function setOpen(item, open){ item.dataset.open = open; OPENROWS[open ? 'add' : 'delete'](item.dataset.key); const b = item.querySelector('.row'); if (b) b.setAttribute('aria-expanded', open); }
function toggleAll(){ ALL = !ALL; OPENROWS.clear(); document.getElementById('det').setAttribute('aria-pressed', ALL); document.querySelectorAll('.item').forEach(i => setOpen(i, ALL)); }
function toggleFold(id){ OPEN[id] = !OPEN[id]; const f = document.activeElement && document.activeElement.closest('.grp'); render(); if (f){ const b = document.querySelector(`.grp[data-id="${f.dataset.id}"] .lbl`); if (b) b.focus(); } }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab){ TAB = t.dataset.tab; document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b === t)); render(); return; }
  if (t.id === 'det') return toggleAll();
  if (t.id === 'thm'){ const r = document.documentElement; const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark'); r.dataset.theme = cur === 'light' ? 'dark' : 'light'; return; }
  if (t.classList.contains('row')){ const i = t.closest('.item'); return setOpen(i, i.dataset.open !== 'true'); }
  if (t.classList.contains('lbl')) return toggleFold(t.closest('.grp').dataset.id);
  if (t.classList.contains('ev')){ t.dataset.open = t.dataset.open !== 'true'; return; }
  if (t.classList.contains('more')){ const r = t.previousElementSibling; if (r && r.classList.contains('rest')){ r.hidden = false; t.remove(); } }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const stops = [...document.querySelectorAll('#app .row, #app button.lbl')].filter(el => el.offsetParent !== null);
  const i = stops.indexOf(document.activeElement);
  if (e.key === 'j' || e.key === 'ArrowDown'){ e.preventDefault(); (stops[Math.min(i+1, stops.length-1)] || stops[0])?.focus(); }
  else if (e.key === 'k' || e.key === 'ArrowUp'){ e.preventDefault(); (stops[Math.max(i-1, 0)] || stops[0])?.focus(); }
  else if (e.key === 'd') toggleAll();
  else if (e.key === 'e'){ OPEN.events = !OPEN.events; render(); }
  else if (e.key === 'Escape'){ if (ALL) toggleAll(); else document.querySelectorAll('.item[data-open=true]').forEach(x => setOpen(x, false)); }
});
render();
</script>
